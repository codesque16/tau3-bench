run_concurrency: 6

runs:
  # Base template for openai_agent solo runs.
  retail_conv_openai_agent_original_policy_completions_R1:
    run_name: "[Opus Base Policy][R1][GEMMA4-26B-A4B-IT][GEMINI-3.1-PRO-PREVIEW][Conversation][Retail]"
    domain: retail
    num_trials: 5
    # task_ids: ["20"]
    trial_concurrency: 5
    max_concurrency: 180
    verbose_logs: true
    seed: -1
    continue_on_length: true
    max_length_continuations: 1   # optional; omit for default 8
    agent: openai_completions_agent
    save_to: retail_conv_openai_agent_opus_base_policy_completions_R1
    retail_policy_path: data/tau2/domains/retail/policy_opus.md
    fresh: true
    agent_llm: gemma4-26b-openai
    agent_llm_args:
      openai_base_url: "http://34.172.115.103:8000"   # vLLM server root
      openai_api_key: "EMPTY"                         # vLLM default
      openai_model: "google/gemma-4-26B-A4B-it"
      temperature: 0
      top_p: 0.95
      top_k: 64
      max_tokens: 4096
      skip_special_tokens: false
      jinja_template_path: "../scripts/gcloud_scripts/gemma4_26b_injected_add_injection.jinja"
      chat_template_kwargs:
        enable_thinking: true
        add_generation_prompt: true
    user: vertex_user_simulator
    user_llm: gemini-3.1-pro-preview
    user_llm_args:
      temperature: 0.3

